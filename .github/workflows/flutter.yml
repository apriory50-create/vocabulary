name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ не хранится в репозитории: создаём её, если нет.
      # Существующие файлы lib/, test/ и pubspec.yaml при этом не меняются.
      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platform android --project-name vocab --org com.example .
          fi

      # flutter_secure_storage требует minSdk 23, шаблон может задавать меньше.
      - name: Raise minSdk to 23
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk\1 = 23/' "$f"
          done

      # Шаблон добавляет INTERNET только в debug, без него ИИ не работает в release.
      - name: Ensure INTERNET permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$MANIFEST"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vocab-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
